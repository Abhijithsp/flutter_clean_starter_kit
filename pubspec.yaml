name: flutter_clean_starter
description: "A Flutter starter kit — Clean Architecture, Bloc/Cubit, Freezed & Material 3 Expressive with E-Commerce."
publish_to: 'none'
version: 1.0.0+1

environment:
  sdk: '>=3.8.0 <4.0.0'

dependencies:
  flutter:
    sdk: flutter

  # ── State Management ──────────────────────────────────────────────────────────
  flutter_bloc: ^9.1.0

  # ── Immutability & Serialization ──────────────────────────────────────────────
  freezed_annotation: ^3.1.0
  json_annotation: ^4.12.0

  # ── Navigation ────────────────────────────────────────────────────────────────
  go_router: ^17.2.3

  # ── Networking ────────────────────────────────────────────────────────────────
  dio: ^5.7.0

  # ── Local Storage ─────────────────────────────────────────────────────────────
  shared_preferences: ^2.3.3
  flutter_local_notifications: ^18.0.1

  # ── UI ────────────────────────────────────────────────────────────────────────
  google_fonts: ^8.1.0
  cached_network_image: ^3.4.1

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^6.0.0

  # ── Code Generation ───────────────────────────────────────────────────────────
  build_runner: ^2.4.13
  freezed: ^3.1.0
  json_serializable: ^6.9.0

flutter:
  uses-material-design: true

  assets:
    - assets/data/products.json
    - assets/data/offers.json
