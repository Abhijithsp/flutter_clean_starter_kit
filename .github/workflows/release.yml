name: Build and Deploy E-Commerce App

on:
  push:
    branches:
      - main

permissions:
  contents: write

jobs:
  build-and-deploy:
    runs-on: ubuntu-latest

    steps:
      # 1. Checkout codebase
      - name: Checkout Code
        uses: actions/checkout@v4

      # 2. Setup Java Environment (for Android APK build)
      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: 'oracle'
          java-version: '17'

      # 3. Setup Flutter SDK
      - name: Set up Flutter
        uses: subosito/flutter-action@v2
        with:
          channel: 'stable'
          cache: true

      # 4. Get Packages
      - name: Install Dependencies
        run: flutter pub get

      # 5. Run Code Generation (Freezed)
      - name: Generate Code
        run: dart run build_runner build --delete-conflicting-outputs

      # 5.5. Create Android debug keystore (required for release build signing config fallback on clean CI runners)
      - name: Create Debug Keystore
        run: |
          keytool -genkey -v -keystore android/app/debug.keystore -storepass android -keypass android -alias androiddebugkey -keyalg RSA -keysize 2048 -validity 10000 -dname "CN=Android Debug,O=Android,C=US"

      # 6. Build Release APK
      - name: Build Release APK
        run: flutter build apk --release

      # 7. Build Flutter Web Demo
      - name: Build Flutter Web
        run: flutter build web --release --base-href "/flutter_clean_starter_kit/"

      # 8. Host APK in the Web Deploy Folder
      - name: Copy APK to Web Build Folder
        run: |
          mkdir -p build/web/downloads
          cp build/app/outputs/flutter-apk/app-release.apk build/web/downloads/app-clean-starter.apk

      # 9. Deploy Web App + APK Download to GitHub Pages
      - name: Deploy to GitHub Pages
        uses: JamesIves/github-pages-deploy-action@v4
        with:
          folder: build/web
          branch: gh-pages

      # 10. Create GitHub Release with APK
      - name: Create GitHub Release
        uses: softprops/action-gh-release@v2
        if: github.ref == 'refs/heads/main'
        with:
          files: build/app/outputs/flutter-apk/app-release.apk
          tag_name: v1.0.0-${{ github.run_number }}
          name: Release v1.0.0 (Build #${{ github.run_number }})
          body: |
            Automatic release generated by GitHub Actions CI/CD.
            
            ### Assets
            - **Android App (APK):** Download the `app-release.apk` below.
            - **Web Live Demo:** [https://abhijithsp.github.io/flutter_clean_starter_kit/](https://abhijithsp.github.io/flutter_clean_starter_kit/)
          draft: false
          prerelease: false
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
